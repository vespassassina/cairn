# Tests and the CLI on every OS it ships for (ADR-014).
#
# Each test job builds the CLI for the machine it runs on and smoke-tests it
# against a real server, so every published executable has been run on its own
# platform. A tag such as v0.1.0 also builds every target and attaches them,
# with SHA256SUMS, to a GitHub release.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2" # keep in step with scripts/build-cli.mjs

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers linux-arm64. GitHub offers it free to public
        # repositories.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm build:cli host
      - run: pnpm smoke:cli

  release:
    name: release the CLI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm build:cli
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/cli/*
