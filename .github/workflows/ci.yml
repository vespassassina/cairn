# Tests and the CLI on every OS it ships for (ADR-014), the Azure template,
# and the server image (ADR-018).
#
# Each test job builds the CLI for the machine it runs on and smoke-tests it
# against a real server, so every published executable has been run on its own
# platform. A tag such as v0.1.0 also builds every target and attaches them,
# with SHA256SUMS, to a GitHub release.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2" # keep in step with scripts/build-cli.mjs

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers linux-arm64. GitHub offers it free to public
        # repositories.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm build:cli host
      - run: pnpm smoke:cli

  azure-template:
    name: azure template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compile the Bicep template
        run: |
          az bicep install
          az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: lint the shell scripts
        run: shellcheck deploy/azure/deploy.sh docker/start.sh

  image:
    name: container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cairn:test
      - name: smoke test the image
        env:
          SERVICE_TOKEN: ci-service-token-0123456789abcdef0123
        run: |
          {
            echo CAIRN_PUBLIC_URL=https://cairn.example.com
            echo CAIRN_AUTH_PROVIDER=github
            echo "CAIRN_AUTH_SECRET=$(openssl rand -hex 32)"
            echo CAIRN_OAUTH_CLIENT_ID=ci
            echo CAIRN_OAUTH_CLIENT_SECRET=ci
            echo CAIRN_ALLOWED_USERS=github:ci
            echo "CAIRN_TOKEN=$SERVICE_TOKEN"
          } > "$RUNNER_TEMP/ci.env"
          docker run --rm --entrypoint litestream cairn:test version
          # Litestream verifies TLS against the system CA bundle, which the
          # Node base image lacks. Without it no replica can be reached.
          docker run --rm --entrypoint sh cairn:test -c 'test -s /etc/ssl/certs/ca-certificates.crt'
          # No GPU libraries: they tripled the image, and Azure pulls it on every cold start.
          if docker run --rm --entrypoint sh cairn:test -c 'find /app/node_modules -name "*providers_cuda*" -o -name "*providers_tensorrt*"' | grep -q .; then
            echo "the image holds CUDA or TensorRT libraries; ONNXRUNTIME_NODE_INSTALL=skip is not working" >&2
            exit 1
          fi
          docker image inspect cairn:test --format 'image size: {{.Size}} bytes'
          docker run -d --name cairn -p 8787:8787 --env-file "$RUNNER_TEMP/ci.env" cairn:test
          for _ in $(seq 1 30); do curl -fsS localhost:8787/health && break; sleep 1; done
          curl -fsS localhost:8787/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/mcp)" = 401
          curl -fsS localhost:8787/.well-known/oauth-authorization-server
          # Semantic search (ADR-022): the model ships in the image and loads.
          for _ in $(seq 1 60); do
            curl -fsS localhost:8787/health | grep -q '"vectors":"ready"' && break; sleep 2
          done
          curl -fsS localhost:8787/health | tee "$RUNNER_TEMP/health.json"
          grep -q '"vectors":"ready"' "$RUNNER_TEMP/health.json"
          curl -fsS -X POST localhost:8787/api/v1/pages -H "authorization: Bearer $SERVICE_TOKEN" \
            -H "content-type: application/json" -H "user-agent: ci" \
            -d '{"title":"DSIP","body":"DSIP is a neuropeptide studied for deep sleep.","change_note":"smoke test"}'
          for _ in $(seq 1 30); do
            curl -fsS localhost:8787/health | grep -q '"pending":0' && break; sleep 1
          done
          curl -fsS "localhost:8787/api/v1/search?q=DSIP%20sleep" -H "authorization: Bearer $SERVICE_TOKEN" | tee "$RUNNER_TEMP/search.json"
          grep -q '"mode":"hybrid"' "$RUNNER_TEMP/search.json"
          docker stats --no-stream --format 'memory in use: {{.MemUsage}}' cairn
          docker logs cairn
      - name: smoke test with a mounted folder (ADR-020)
        run: |
          data="$RUNNER_TEMP/cairn-data"
          mkdir -p "$data" && sudo chown 1000:1000 "$data"
          docker run -d --name cairn-mounted -p 8788:8787 --env-file "$RUNNER_TEMP/ci.env" -v "$data:/data" cairn:test
          for _ in $(seq 1 30); do curl -fsS localhost:8788/health && break; sleep 1; done
          curl -fsS localhost:8788/health
          docker logs cairn-mounted 2>&1 | tee "$RUNNER_TEMP/mounted.log"
          grep -q "on a mounted volume" "$RUNNER_TEMP/mounted.log"
          test -s "$data/cairn.sqlite"
          docker rm -f cairn-mounted
          # A folder the container cannot write to must stop it with a clear message.
          sudo chown root:root "$data" && sudo chmod 755 "$data"
          if docker run --rm --env-file "$RUNNER_TEMP/ci.env" -v "$data:/data" cairn:test > "$RUNNER_TEMP/denied.log" 2>&1; then
            echo "expected the container to refuse a read-only folder"; exit 1
          fi
          cat "$RUNNER_TEMP/denied.log"
          grep -q "is not writable" "$RUNNER_TEMP/denied.log"
      - name: check the compose file
        working-directory: deploy/docker
        run: |
          cp env.example .env
          CAIRN_IMAGE=cairn:test docker compose config --quiet
      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: sign in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish for amd64 and arm64
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: release the CLI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches the version
        # pnpm set-version writes it; a release whose files say another
        # version cannot tell anyone whether they are up to date.
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in package.json. Run pnpm set-version first"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm build:cli
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/cli/*
      - name: build @vespassassina/cairncli for npm
        run: pnpm --filter @vespassassina/cairncli build
      - name: publish @vespassassina/cairncli to npm
        # NPM_TOKEN is an npm automation token with publish rights on the
        # @vespassassina scope (docs/CLI.md), set by the owner as a
        # repository secret. Missing it fails this step loudly rather than
        # skipping it, so a tag never ships a GitHub release without the
        # matching npm one.
        run: pnpm --filter @vespassassina/cairncli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
