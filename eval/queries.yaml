# 30 real queries with expected page ids.
# Write these before tuning search. Use things you have genuinely wanted to find.
# recall@5 = share of queries where at least one expected page appears in the top 5.

# q01 and q02 were placeholders about drones and 3D printing, written before
# there was a workspace. Nothing in Cairn answers them, so they scored nothing
# and made the set look larger than it was. Removed on 2026-09-14; n05 keeps a
# 3D printing query, where it belongs, among the ones with no answer.

queries:

  # q03 to q16: written by the agent on 2026-09-12 from the peptide wiki seed,
  # each checked against the wiki text. They measure search on real content
  # until the owner adds queries from things they actually wanted to find.
  # Expected pages are the ones a reader would accept as the answer.
  - id: q03
    query: "tendon healing peptide"
    expected: [pg_bpc-157, pg_tb-500]
    lang: en
    notes: "plain-language need; the anchor healing compounds"
  - id: q04
    query: "Ozempic"
    expected: [pg_semaglutide]
    lang: en
    notes: "brand name, only in the aliases line"
  - id: q05
    query: "Mounjaro weight loss"
    expected: [pg_tirzepatide]
    lang: en
    notes: "brand name plus a common word that matches many pages"
  - id: q06
    query: "wolverine stack"
    expected: [pg_stack_bpc-157-tb-500]
    lang: en
    notes: "nickname, only in the stack's also-known-as line"
  - id: q07
    query: "copper peptide for skin"
    expected: [pg_ghk-cu, pg_ahk-cu]
    lang: en
    notes: "description instead of a name"
  - id: q08
    query: "Ibutamoren"
    expected: [pg_mk-677]
    lang: en
    notes: "the other half of a two-name title"
  - id: q09
    query: "thymus bioregulator"
    expected: [pg_thymalin, pg_cat_bioregulators]
    lang: en
    notes: "category concept plus organ"
  - id: q10
    query: "GLP-1 drugs you should not stack with other peptides"
    expected: [pg_semaglutide, pg_tirzepatide, pg_retatrutide, pg_mazdutide, pg_survodutide, pg_liraglutide]
    lang: en
    notes: "sentence-shaped; the answer is in the mixing caution on each incretin page"
  - id: q11
    query: "nasal spray for anxiety"
    expected: [pg_selank]
    lang: en
    notes: "route plus use"
  - id: q12
    query: "tanning peptide"
    expected: [pg_mt-2, pg_mt-1]
    lang: en
    notes: "use, not a name"
  - id: q13
    query: "elamipretide mitochondria"
    expected: [pg_ss-31]
    lang: en
    notes: "alias plus mechanism"
  - id: q14
    query: "senolytic that clears senescent cells"
    expected: [pg_foxo4-dri]
    lang: en
    notes: "mechanism-level description"
  - id: q15
    query: "FDA approved libido drug for women"
    expected: [pg_pt-141]
    lang: en
    notes: "several common words; many pages mention FDA"
  - id: q16
    query: "CagriSema"
    expected: [pg_stack_cagrilintide-semaglutide]
    lang: en
    notes: "product name only in a stack title"

  # q17 to q30: for the owner, from real searches

  # q17 to q30: written by the agent on 2026-09-14 to finish the set of 30 the
  # launch checklist asks for. Each was written from the wiki's text, and its
  # expected pages chosen from that text, before any of them was run: a query
  # written while watching the results measures nothing. They lean on the cases
  # q03 to q16 do not cover: brand names, misspellings, a question about two
  # peptides together, and needs described without naming anything.
  - id: q17
    query: "which peptide makes you really hungry"
    expected: [pg_ghrp-6]
    lang: en
    notes: "18 pages mention appetite; only this one is about causing it"
  - id: q18
    query: "Vyleesi"
    expected: [pg_pt-141]
    lang: en
    notes: "brand name, on one page"
  - id: q19
    query: "growth hormone without injections"
    expected: [pg_mk-677]
    lang: en
    notes: "the need, not the name; the page says orally active"
  - id: q20
    query: "Khavinson peptide for the liver"
    expected: [pg_livagen]
    lang: en
    notes: "a family of 16 near-identical pages, one organ apart"
  - id: q21
    query: "banned in sport by WADA"
    expected: [pg_aicar]
    lang: en
    notes: "one page carries the term"
  - id: q22
    query: "healing a stress fracture"
    expected: [pg_teriparatide]
    lang: en
    notes: "the term is on one page, inside a sentence about bone"
  - id: q23
    query: "can I take BPC-157 and TB-500 together"
    expected: [pg_stack_bpc-157-tb-500, pg_bpc-157, pg_tb-500]
    lang: en
    notes: "a question about two things at once; the stack page is the best answer"
  - id: q24
    query: "peptide for IBD gut inflammation"
    expected: [pg_kpv, pg_bpc-157]
    lang: en
  - id: q25
    query: "stop hair loss"
    expected: [pg_ahk-cu, pg_ptd-dbm, pg_zinc-thymulin]
    lang: en
    notes: "three pages, none of them titled anything about hair"
  - id: q26
    query: "keep fertility while on testosterone replacement"
    expected: [pg_gonadorelin, pg_hcg]
    lang: en
  - id: q27
    query: "GH peptide without the cortisol and prolactin spikes"
    expected: [pg_ipamorelin]
    lang: en
    notes: "the distinguishing sentence is on the page, in those words"
  - id: q28
    query: "the one that damaged kidneys in trials"
    expected: [pg_adipotide]
    lang: en
    notes: "five pages mention kidneys; one was pulled over them"
  - id: q29
    query: "telomerase"
    expected: [pg_epithalon]
    lang: en
  - id: q30
    query: "semaglutid"
    expected: [pg_semaglutide]
    lang: en
    notes: "misspelling: one letter short of the title"

  # n01 to n06: questions the peptide wiki has no answer to, added by the agent
  # on 2026-09-12 (ADR-021). `expected: none` means the right result is no
  # pages. Several share one or two words with the wiki on purpose, checked
  # against the index: "first" and "adhesion" are both on pg_vesugen, and
  # "insulin" and "pump" on pg_igf-1-lr3.
  - id: n01
    query: "sourdough starter feeding schedule"
    expected: none
    lang: en
  - id: n02
    query: "kubernetes ingress certificate renewal"
    expected: none
    lang: en
  - id: n03
    query: "Italian tax deadline for freelancers"
    expected: none
    lang: en
  - id: n04
    query: "how to fix a leaking kitchen tap"
    expected: none
    lang: en
  - id: n05
    query: "3D printer first layer adhesion"
    expected: none
    lang: en
  - id: n06
    query: "insulin pump battery replacement"
    expected: none
    lang: en

  # h01 to h04: conversational questions with an answer, added by the agent on
  # 2026-09-13 (ADR-022). Keyword search cannot answer them, because the pages
  # use other words; semantic search should. The vector margin was chosen
  # while looking at these same queries, so they show what hybrid search adds
  # rather than prove it generalises.
  - id: h01
    query: "something to help me fall asleep"
    expected: [pg_dsip]
    lang: en
    notes: "the page says sleep, never asleep or fall"
  - id: h02
    query: "anything for wrinkles"
    expected: [pg_matrixyl, pg_leuphasyl, pg_snap-8, pg_ghk-cu]
    lang: en
  - id: h03
    query: "boost my memory and focus"
    expected: [pg_cerebrolysin, pg_semax, pg_selank, pg_cat_nootropics-cognitive, pg_p21, pg_fgl-l, pg_pe-22-28]
    lang: en
  - id: h04
    query: "I want to lose weight"
    expected: [pg_cat_fat-loss, pg_semaglutide, pg_tirzepatide, pg_retatrutide, pg_cagrilintide, pg_liraglutide, pg_mazdutide, pg_survodutide, pg_aod-9604, pg_5-amino-1mq, pg_adipotide, pg_tesamorelin]
    lang: en

  # n07 to n09: more questions with no answer. n09 is on the wiki's own topic,
  # which is the hard case for semantic search.
  - id: n07
    query: "what is the weather tomorrow"
    expected: none
    lang: en
  - id: n08
    query: "recipe for lasagna"
    expected: none
    lang: en
  - id: n09
    query: "peptide reconstitution bacteriostatic water"
    expected: none
    lang: en
    notes: "checked: no page mentions reconstitution or bacteriostatic water"
