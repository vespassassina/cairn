# Cairn on your own server: Proxmox, a NAS, or any machine with Docker
# (ADR-020). One container. The database lives in ./data on this machine's
# disk. See docs/DEPLOY-DOCKER.md.
#
# Settings and secrets go in .env next to this file, which git ignores:
# copy env.example to .env and fill it in.

services:
  cairn:
    image: ${CAIRN_IMAGE:-ghcr.io/vespassassina/cairn:latest}
    restart: unless-stopped
    # `docker stop` allows 10 seconds by default, then kills. That is not
    # always enough to drain requests, back up and close SQLite, and being
    # killed part way through is how an unfinished write reaches a replica
    # (ADR-046). Keep this above CAIRN_SHUTDOWN_SECONDS, which defaults to 25.
    stop_grace_period: 30s
    env_file: .env
    ports:
      - "${CAIRN_BIND:-127.0.0.1}:8787:8787"
    volumes:
      # A local disk only. SQLite's locking is unreliable on NFS and SMB.
      - ${CAIRN_DATA:-./data}:/data
